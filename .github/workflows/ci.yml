# Lint, type-check and test every pull request and every push to main.
#
# Read-only on purpose: nothing here deploys, and the token cannot write to
# the repository. Actions are pinned to a commit SHA, with the version beside
# it; Dependabot's github-actions entry keeps both up to date.
name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run check
            - run: npm test
