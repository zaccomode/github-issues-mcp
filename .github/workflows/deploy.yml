# Deploy the Worker when a release is published.
#
# CI never runs on tags, so this checks the release for itself before it
# deploys: the tagged commit must be on main, the tag must match the version in
# package.json, and the same checks as CI must pass. `npm run deploy` then
# applies D1 migrations and deploys the Worker.
#
# Releases published through this server's own `publish_release` start this
# workflow, because an App's token triggers workflows and Actions' own
# GITHUB_TOKEN does not. `publish_release` lists it in its preview.
#
# It runs on `released`, which GitHub sends both when a release is published
# and when a prerelease is later promoted to a full release; `published` alone
# would miss the promotion. Prereleases don't deploy.
#
# The checks run in their own job, with no environment and no secrets, because
# `npm ci` there runs dependencies' install scripts. The deploy job installs
# afresh with --ignore-scripts, so nothing a dependency runs at install time
# shares a job with CLOUDFLARE_API_TOKEN.
#
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID live in the `production`
# environment, which only allows `v*` tags, so no pull request or branch run can
# read them. The checks above come from this file at the tagged commit, so they
# only hold if creating `v*` tags is limited to admins (a tag ruleset) or the
# environment requires a reviewer; see the README's deploy section.
#
# Run it by hand from a tag ("Use workflow from") to redeploy that release,
# e.g. to roll back. Migrations don't roll back, so only do that when the older
# code works against the newer schema.
name: Deploy

on:
    release:
        types: [released]
    workflow_dispatch:

permissions:
    contents: read

# Queue deploys rather than cancel one, which could stop it between applying
# migrations and deploying the code that needs them.
concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    check:
        if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Check the release is a tag on main
              run: |
                  if [ "$GITHUB_REF_TYPE" != tag ]; then
                    echo "::error::Deploy from a release tag, not the branch '$GITHUB_REF_NAME'."
                    exit 1
                  fi
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                    echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
                    exit 1
                  fi

            - name: Check the tag matches package.json
              run: |
                  version="v$(node -p 'require("./package.json").version')"
                  if [ "$GITHUB_REF_NAME" != "$version" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)."
                    exit 1
                  fi

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run check
            - run: npm test

    deploy:
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: production
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # No npm cache here: the check job's install could have written to it.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22

            # wrangler needs no install scripts: esbuild and workerd ship their
            # binaries as optional platform packages.
            - run: npm ci --ignore-scripts

            - run: npm run deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
